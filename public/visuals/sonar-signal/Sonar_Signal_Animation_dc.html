<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0B1F1C; overflow:hidden; }
  * { box-sizing:border-box; }
</style>
</helmet>
<div style="position:fixed; inset:0; background:#0B1F1C;">
  <canvas ref="{{ setCanvas }}" style="position:absolute; inset:0; width:100%; height:100%; display:block;"></canvas>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100vh&quot;},&quot;autoPlay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Playback&quot;},&quot;progress&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.01,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Playback&quot;},&quot;duration&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:10,&quot;min&quot;:6,&quot;max&quot;:16,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Playback&quot;},&quot;signalColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#14B8A6&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;atmosphere&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.4,&quot;max&quot;:1.6,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;beamGlow&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.32,&quot;min&quot;:0.1,&quot;max&quot;:0.6,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Look&quot;}}">
class Component extends DCLogic {
  renderVals() {
    if (!this._r) {
      this._r = { setCanvas: el => { if (el) { this.canvas = el; this.tryInit(); } } };
    }
    return this._r;
  }

  componentDidMount() {
    this.renderP = 0; this.targetP = 0; this.manual = false; this.clock = 0; this.last = 0;
    this.onResize = () => this.resize();
    window.addEventListener('resize', this.onResize);
    const self = this;
    // Integration API: drive the animation from scroll progress (0..1).
    window.SonarSignal = {
      setProgress(p) {
        self.manual = true;
        self.targetP = Math.max(0, Math.min(1, +p || 0));
        self.renderP = self.targetP;
        if (self.frame) self.frame(performance.now() / 1000); // render now (don't wait on rAF)
      },
      play() { self.manual = false; },
      pause() { self.manual = true; },
      get progress() { return self.renderP; }
    };
    this.tryInit();
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    if (this.raf) cancelAnimationFrame(this.raf);
    if (this.renderer) this.renderer.dispose();
    if (window.SonarSignal) delete window.SonarSignal;
  }

  cfg() {
    const p = this.props || {};
    return {
      signal: p.signalColor || '#14B8A6',
      atmosphere: p.atmosphere != null ? p.atmosphere : 1,
      beamGlow: p.beamGlow != null ? p.beamGlow : 0.32,
      autoPlay: p.autoPlay != null ? p.autoPlay : true,
      duration: p.duration != null ? p.duration : 10,
      progress: p.progress != null ? p.progress : null,
    };
  }

  resize() {
    if (!this.renderer || !this.canvas) return;
    const w = this.canvas.clientWidth || window.innerWidth;
    const h = this.canvas.clientHeight || window.innerHeight;
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
  }

  tryInit() {
    if (this.inited || !this.canvas) return;
    if (!window.THREE) { setTimeout(() => this.tryInit(), 60); return; }
    this.inited = true;
    this.initThree();
  }

  glowTexture(THREE) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.22, 'rgba(255,255,255,0.55)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }

  // A scattered fragment of business/search data (geometric, non-readable).
  makeFragment(THREE, w, h) {
    const g = new THREE.Group();
    const parts = [];
    const add = (mw, mh, hex, op, ox, oy) => {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(mw, mh),
        new THREE.MeshBasicMaterial({ color: hex, transparent: true, opacity: op, depthWrite: false })
      );
      m.position.set(ox, oy, 0);
      m.userData.base = new THREE.Color(hex); m.userData.op = op;
      g.add(m); parts.push(m);
    };
    add(w, 0.14, 0x14B8A6, 1, 0, h / 2 - 0.16);
    for (let i = 0; i < 3; i++)
      add(w * (0.82 - i * 0.16), 0.09, 0x7FA39C, 1, -w * (0.08 + i * 0.08), h / 2 - 0.5 - i * 0.28);
    add(w * 0.4, h * 0.3, 0x0E8C7F, 1, -w * 0.25, -h * 0.24);
    g.userData.parts = parts;
    return g;
  }

  // The structured website interface, built as a flat 3D object (hairline
  // frame + list rows + content bars + a highlighted data grid). No text, no card.
  buildInterface(THREE) {
    const g = new THREE.Group();
    const items = [];
    const add = (w, h, x, y, hex, op, z) => {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: hex, transparent: true, opacity: 0, depthWrite: false })
      );
      const slot = new THREE.Vector3(x, y, 0);
      m.position.copy(slot);
      m.userData = {
        base: new THREE.Color(hex), op, slot,
        scatter: new THREE.Vector3(
          x + (Math.random() - 0.5) * 26,
          y + (Math.random() - 0.5) * 22,
          (z || 0) - 8 - Math.random() * 16
        ),
        z: z || 0
      };
      g.add(m); items.push(m);
    };
    const line = 0x6E8F87, bright = 0xC7DBD5, acc = 0x14B8A6, dim = 0x0E8C7F;
    // frame outline
    add(20, 0.06, 0, 6, line, 0.55);
    add(20, 0.06, 0, -6, line, 0.55);
    add(0.06, 12, -10, 0, line, 0.55);
    add(0.06, 12, 10, 0, line, 0.55);
    // left column (sidebar list)
    const lx = -5.6;
    [3.3, 2.3, 1.3, -1.3, -2.3, -3.3].forEach((y, i) => {
      add(5.4 - (i % 3) * 0.7, 0.16, lx, y, line, 0.85, -1);
    });
    // right column (main content)
    add(6.2, 0.36, 5.4, 3.4, bright, 0.9, 1);          // title
    add(6.2, 0.15, 5.4, 2.3, line, 0.8, 1);
    add(5.2, 0.15, 4.9, 1.5, line, 0.7, 1);
    add(4.2, 0.15, 4.4, 0.7, line, 0.6, 1);
    // highlighted data grid (bottom-right)
    for (let r = 0; r < 2; r++)
      for (let c = 0; c < 3; c++)
        add(1.5, 0.5, 3.5 + c * 2.0, -2.4 - r * 1.0, r === 0 && c === 0 ? acc : dim, r === 0 && c === 0 ? 0.9 : 0.5, 2);
    // node connectors (from center blip outward)
    add(2.6, 0.05, -1.7, 0, acc, 0.6, 0);
    add(2.6, 0.05, 1.7, 0, acc, 0.6, 0);
    g.userData.items = items;
    return g;
  }

  initThree() {
    const THREE = window.THREE;
    const w = this.canvas.clientWidth || window.innerWidth;
    const h = this.canvas.clientHeight || window.innerHeight;

    const scene = new THREE.Scene();
    const INK = 0x0B1F1C;
    scene.background = new THREE.Color(INK);
    scene.fog = new THREE.FogExp2(INK, 0.0092);

    const camera = new THREE.PerspectiveCamera(52, w / h, 0.1, 500);
    camera.position.set(0, 0, 34);

    const renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    renderer.setClearColor(INK, 1);

    this.scene = scene; this.camera = camera; this.renderer = renderer;

    // particle field
    const N = 2600;
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      pos[i * 3] = (Math.random() - 0.5) * 130;
      pos[i * 3 + 1] = (Math.random() - 0.5) * 90;
      pos[i * 3 + 2] = -200 + Math.random() * 240;
    }
    const pgeo = new THREE.BufferGeometry();
    pgeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const pmat = new THREE.PointsMaterial({
      color: 0x6FE3CE, size: 0.16, transparent: true, opacity: 0.5,
      sizeAttenuation: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    const points = new THREE.Points(pgeo, pmat);
    scene.add(points);
    this.points = points; this.pmat = pmat;

    // fragments scattered through depth (kept near center laterally)
    this.fragments = [];
    const FN = 46;
    for (let i = 0; i < FN; i++) {
      const cw = 2.6 + Math.random() * 2.4, ch = 1.8 + Math.random() * 1.5;
      const frag = this.makeFragment(THREE, cw, ch);
      const side = Math.random() < 0.5 ? -1 : 1;
      frag.position.set(
        side * (5 + Math.random() * 24),
        (Math.random() - 0.5) * 38,
        -5 - Math.random() * 122
      );
      frag.rotation.set((Math.random() - 0.5) * 0.35, (Math.random() - 0.5) * 0.6, (Math.random() - 0.5) * 0.22);
      frag.userData.z = frag.position.z;
      scene.add(frag);
      this.fragments.push(frag);
    }

    // focused signal glow (distance-scaled soft sprite plane, billboarded)
    const beamMat = new THREE.ShaderMaterial({
      uniforms: { uColor: { value: new THREE.Color(0x14B8A6) }, uOpacity: { value: 0 } },
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
      fragmentShader: 'varying vec2 vUv; uniform vec3 uColor; uniform float uOpacity; void main(){ vec2 c=vUv-0.5; float d=length(c*vec2(1.0,1.3)); float a=smoothstep(0.5,0.0,d); a=pow(a,1.7); gl_FragColor=vec4(uColor,a*uOpacity); }'
    });
    const beam = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), beamMat);
    scene.add(beam);
    this.beam = beam; this.beamMat = beamMat;

    // detected blip + restrained glow (dead center)
    this.blipPos = new THREE.Vector3(0, 0, -150);
    const glowTex = this.glowTexture(THREE);
    const blipMat = new THREE.MeshBasicMaterial({ color: 0x14B8A6, transparent: true, opacity: 0 });
    const blip = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 24), blipMat);
    blip.position.copy(this.blipPos);
    const glowMat = new THREE.SpriteMaterial({ map: glowTex, color: 0x14B8A6, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });
    const glow = new THREE.Sprite(glowMat);
    glow.position.copy(this.blipPos);
    glow.scale.set(5, 5, 1);
    scene.add(blip); scene.add(glow);
    this.blip = blip; this.blipMat = blipMat; this.glow = glow; this.glowMat = glowMat;

    // structured interface, centered on the blip
    const iface = this.buildInterface(THREE);
    iface.position.copy(this.blipPos);
    scene.add(iface);
    this.iface = iface;

    this.tmpTarget = new THREE.Vector3();
    this.last = performance.now();
    this.frame = (nowSec) => {
      this.renderP += (this.targetP - this.renderP) * (this.manual ? 1 : 0.14);
      this.applyProgress(this.renderP, nowSec);
      this.renderer.render(this.scene, this.camera);
    };
    const loop = () => {
      this.raf = requestAnimationFrame(loop);
      const now = performance.now();
      const dt = Math.min(0.05, (now - this.last) / 1000);
      this.last = now;
      const cfg = this.cfg();
      if (!this.manual) {
        if (!cfg.autoPlay && cfg.progress != null) {
          this.targetP = Math.max(0, Math.min(1, cfg.progress));
        } else {
          this.clock += dt;
          const cycle = cfg.duration + 2.2;
          const ph = this.clock % cycle;
          this.targetP = ph < cfg.duration ? ph / cfg.duration : 1;
        }
      }
      this.frame(now / 1000);
    };
    loop();
    // correct any pre-layout sizing on the next tick
    setTimeout(() => this.resize(), 60);
  }

  applyProgress(p, time) {
    const THREE = window.THREE;
    const cfg = this.cfg();
    const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
    const s = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
    const lerp = (a, b, t) => a + (b - a) * t;
    const sigCol = new THREE.Color(cfg.signal);

    const beamT = s(0.05, 0.62, p);
    const camT = s(0.12, 0.9, p); const camE = camT * camT * (3 - 2 * camT);
    const blipI = s(0.42, 0.6, p);
    const assemble = s(0.56, 0.9, p);

    // camera dolly + settling sway, centered on the blip
    const camZ = lerp(34, -133, camE);
    const sway = 1.1 * (1 - camE * 0.94);
    this.camera.position.set(Math.sin(time * 0.18) * sway, Math.cos(time * 0.14) * sway * 0.6, camZ);
    const look = s(0.5, 0.86, p);
    this.tmpTarget.set(0, 0, lerp(camZ - 40, this.blipPos.z, look));
    this.camera.lookAt(this.tmpTarget);

    // focused signal glow travelling forward through center
    const beamZ = lerp(24, -172, beamT);
    const beamVis = s(0.05, 0.12, p) * (1 - s(0.6, 0.82, p));
    const beamDist = Math.max(8, this.camera.position.z - beamZ);
    this.beam.position.set(0, 0, beamZ);
    this.beam.quaternion.copy(this.camera.quaternion);
    const bs = beamDist * 0.42;
    this.beam.scale.set(bs, bs, 1);
    this.beamMat.uniforms.uColor.value.copy(sigCol);
    this.beamMat.uniforms.uOpacity.value = beamVis * cfg.beamGlow * 0.85;

    // atmosphere
    this.pmat.opacity = 0.5 * cfg.atmosphere * (1 - assemble * 0.5);
    this.points.rotation.z = time * 0.006;
    this.points.position.y = Math.sin(time * 0.1) * 0.6;

    // fragment illumination as the signal passes; fade as interface forms
    const sigma = 9;
    const frFade = 1 - assemble * 0.96;
    for (const f of this.fragments) {
      const d = f.userData.z - beamZ;
      let ill = Math.exp(-(d * d) / (2 * sigma * sigma));
      if (beamZ < f.userData.z) ill = Math.max(ill, 0.09 * beamT);
      ill = clamp(ill, 0, 1);
      for (const m of f.userData.parts) {
        m.material.opacity = m.userData.op * (0.14 + 0.86 * ill) * frFade;
        m.material.color.copy(m.userData.base).multiplyScalar(0.3 + 0.7 * ill);
      }
    }

    // blip
    const pulse = 1 + Math.sin(time * 2.4) * 0.06 * blipI;
    this.blipMat.color.copy(sigCol);
    this.blipMat.opacity = blipI * (1 - assemble * 0.15);
    this.blip.scale.setScalar(pulse);
    this.glowMat.color.copy(sigCol);
    this.glowMat.opacity = blipI * 0.5 * (1 - assemble * 0.45);
    const gs = (4.4 + Math.sin(time * 2.4) * 0.3) * (0.6 + 0.4 * blipI);
    this.glow.scale.set(gs, gs, 1);

    // structured interface assembling around the blip, billboarded flat to camera
    this.iface.quaternion.copy(this.camera.quaternion);
    for (const m of this.iface.userData.items) {
      const sc = m.userData.scatter, sl = m.userData.slot;
      m.position.set(lerp(sc.x, sl.x, assemble), lerp(sc.y, sl.y, assemble), lerp(sc.z, sl.z, assemble));
      m.material.opacity = m.userData.op * (0.05 + 0.95 * assemble) * assemble;
      m.material.color.copy(m.userData.base).multiplyScalar(0.3 + 0.7 * assemble);
    }
  }
}
</script>
</body>
</html>
